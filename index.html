<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UPAR Suite</title>
<meta name="description" content="UPAR Suite — sistem bersepadu Unit Pendispensan Aseptik & Radiofarmasi, Jabatan Farmasi HPUSM.">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UPAR Suite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="config.js"></script>
<script>try{var t=localStorage.getItem('upar.tema');if(t)document.documentElement.dataset.theme=t;var w=localStorage.getItem('upar.warna');if(w)document.documentElement.style.setProperty('--brand',w)}catch(e){}</script>
</head>
<body>
<div id="app" aria-live="polite">
  <div style="min-height:100dvh;display:grid;place-items:center"><img src="assets/logo.svg" alt="" width="72" height="72" style="animation:float 2s ease-in-out infinite"></div>
</div>
<div class="toasts" id="toasts"></div>
<noscript>UPAR Suite memerlukan JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
